name = "zona-ai"
main = "src/index.js"
compatibility_date = "2024-09-01"
account_id = "2186a57344e459853657cea6213a2c74"

# Secrets gestite via `wrangler secret put` (NON in questo file):
# - API_KEY                    (Groq, già presente nel Worker deployato)
# - SUPABASE_SERVICE_ROLE_KEY  (da aggiungere prima del deploy)
# - GEMINI_API_KEY             (lettura AI dei check fisici, /vision-check)

# Binding Images: riduce le foto dei check a 1024 px prima di mandarle a Gemini.
[images]
binding = "IMAGES"

# Pirsi propone (Fase 3): ogni lunedì alle 06:00 Europe/Rome. I cron sono in UTC:
# 04:00 d'estate (CEST) e 05:00 d'inverno (CET); il Worker lavora solo in quello che a Roma sono le 6.
[triggers]
crons = ["0 4 * * 1", "0 5 * * 1"]

# Limite di richieste per persona (Pirsi 010). La chiave è l'id della persona.
# Senza questi binding il Worker ripiega su un conto in memoria (src/porta.js).
[[ratelimits]]
name = "LIMITE_COACH"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "LIMITE_FOTO"
namespace_id = "1002"
simple = { limit = 3, period = 60 }
